
<!DOCTYPE html>
<html lang="es">
<head>
    <link type="text/css" rel="stylesheet" href="style.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCTOS DE LA TIENDA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: beige;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 48px 20px;
            gap: 30px;
        }

        h1 {
            color: #333;
            font-size: 36px;
            text-align: center;
        }

        /* Contenedor del carrusel */
        .carrete {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        /* Tira de imágenes */
        .pista {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease;
        }

        .pista img {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
        }

        /* Botones anterior y siguiente */
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,.45);
            color: white;
            border: none;
            font-size: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(0,0,0,.75);
        }

        .prev {
            left: 12px;
        }

        .next {
            right: 12px;
        }

        /* Puntos indicadores */
        .puntos {
            position: absolute;
            bottom: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .puntos button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,.5);
            cursor: pointer;
        }

        .puntos button.activo {
            background: white;
        }

        /* Botón para ir a otra página */
        .boton-pagina {
            display: inline-block;
            background: #333;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .boton-pagina:hover {
            background: #777;
        }

    </style>
</head>

<body>

    <h1 class="especial">ALL PRODUCTS</h1>

    <div class="carrete">

    </a>

    <script>

        const pista = document.querySelector('.pista');
        const fotos = pista.querySelectorAll('img');
        const puntos = document.querySelector('.puntos');

        let actual = 0;
        let timer;

        // Crear un punto por cada imagen
        fotos.forEach((_, i) => {
            const p = document.createElement('button');
            p.type = 'button';
            p.setAttribute('aria-label', 'Ir a imagen ' + (i + 1));
            p.addEventListener('click', () => irA(i));
            puntos.appendChild(p);
        });

        // Cambiar de imagen
        function irA(i) {

            actual = (i + fotos.length) % fotos.length;

            pista.style.transform = `translateX(-${actual * 100}%)`;

            puntos.querySelectorAll('button').forEach((p, j) => {
                p.classList.toggle('activo', j === actual);
            });

            reiniciarAuto();
        }

        // Botón anterior
        document.querySelector('.prev').onclick = () => {
            irA(actual - 1);
        };

        // Botón siguiente
        document.querySelector('.next').onclick = () => {
            irA(actual + 1);
        };

        // Flechas del teclado
        document.addEventListener('keydown', e => {

            if (e.key === 'ArrowLeft') {
                irA(actual - 1);
            }

            if (e.key === 'ArrowRight') {
                irA(actual + 1);
            }

        });

        // Deslizar con el dedo en móvil
        let inicioX = 0;

        pista.addEventListener('touchstart', e => {
            inicioX = e.touches[0].clientX;
        });

        pista.addEventListener('touchend', e => {

            const dx = e.changedTouches[0].clientX - inicioX;

            if (Math.abs(dx) > 50) {
                irA(actual + (dx < 0 ? 1 : -1));
            }

        });

        // Avance automático cada 4 segundos
        function reiniciarAuto() {

            clearInterval(timer);

            timer = setInterval(() => {
                irA(actual + 1);
            }, 4000);

        }

        // Iniciar carrusel
        irA(0);

    </script>

    <script type="module" src="script.js"></script>
  </body>
</html>
